name: Bug report
description: Report a reproducible problem with the App Store 2.3.3 menu.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload game files, saves, credentials, or logs containing personal paths. Security issues belong in a private vulnerability report.
  - type: input
    id: release
    attributes:
      label: Menu release
      placeholder: 2.3.3.1
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game version and store
      placeholder: Cyberpunk 2077 2.3.3, Mac App Store
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Mac and macOS
      placeholder: M3 Pro, macOS 15.x
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: Game location
      options:
        - Internal drive
        - External drive
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the exact command or quick action.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and launcher status
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I tested with the Mac App Store 2.3.3 build.
          required: true
        - label: I removed personal information and did not attach copyrighted game files.
          required: true
