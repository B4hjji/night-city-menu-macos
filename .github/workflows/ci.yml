name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate and build overlay
        env:
          NCC_BUILD_OVERLAY: "1"
        run: bash ./tools/check.sh
